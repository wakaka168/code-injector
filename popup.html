<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Injector</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      min-height: 100px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .header-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .header-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    .page-info {
      padding: 8px 16px;
      background: white;
      border-bottom: 1px solid #e9ecef;
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .page-info span {
      color: #667eea;
      font-weight: 500;
    }

    .rules-container {
      max-height: 400px;
      overflow-y: auto;
    }

    .rule-item {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background: white;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.15s;
    }

    .rule-item:hover {
      background: #f8f9ff;
    }

    .rule-item.disabled {
      opacity: 0.45;
    }

    .rule-info {
      flex: 1;
      min-width: 0;
    }

    .rule-name {
      font-size: 13px;
      font-weight: 500;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rule-meta {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
      display: flex;
      gap: 6px;
    }

    .rule-meta .tag {
      background: #f0f0f0;
      padding: 1px 6px;
      border-radius: 3px;
    }

    .rule-meta .tag.matched {
      background: #d4edda;
      color: #155724;
    }

    .rule-meta .tag.unmatched {
      background: #fff3cd;
      color: #856404;
    }

    .run-btn {
      background: #667eea;
      border: none;
      color: white;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      font-weight: 500;
    }

    .run-btn:hover {
      background: #5a6fd6;
    }

    .run-btn:active {
      transform: scale(0.95);
    }

    .run-btn.success {
      background: #2ed573;
    }

    .run-btn.error {
      background: #ff4757;
    }

    .empty-state {
      text-align: center;
      padding: 30px 16px;
      color: #aaa;
      font-size: 12px;
    }

    .empty-state p {
      margin-bottom: 8px;
    }

    .empty-state a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }

    .empty-state a:hover {
      text-decoration: underline;
    }

    .footer {
      padding: 8px 16px;
      background: white;
      border-top: 1px solid #e9ecef;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .run-all-btn {
      background: #667eea;
      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }

    .run-all-btn:hover {
      background: #5a6fd6;
    }

    .footer-info {
      font-size: 11px;
      color: #999;
    }

    /* 滚动条样式 */
    .rules-container::-webkit-scrollbar {
      width: 4px;
    }

    .rules-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .rules-container::-webkit-scrollbar-thumb {
      background: #ddd;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔧 Code Injector</h1>
    <div class="header-actions">
      <button class="header-btn" id="settingsBtn">⚙ 设置</button>
    </div>
  </div>

  <div class="page-info" id="pageInfo">
    当前页面：<span id="currentUrl">加载中...</span>
  </div>

  <div class="rules-container" id="rulesContainer">
    <div class="empty-state" id="emptyState">
      <p>暂无规则</p>
      <a href="#" id="goSettings">前往设置页面添加规则</a>
    </div>
  </div>

  <div class="footer" id="footer" style="display:none;">
    <button class="run-all-btn" id="runAllBtn">▶ 运行全部匹配规则</button>
    <span class="footer-info" id="matchInfo"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
